services:
  randomhd2:
    # 固定镜像名：本地构建后可以用 docker save/load 把它搬到服务器，
    # 服务器上用 `docker compose up -d --no-build` 直接跑，不在服务器上执行构建。
    image: randomhd2:local
    build: .
    container_name: randomhd2
    restart: always
    # 与镜像里的 CMD 相同，放在这里是为了不重建镜像也能生效：
    # 镜像构建时已生成好全部产物，启动时不需要再跑 generate:data。
    command: ["node", "server/sync-server.mjs"]
    ports:
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
      - PORT=5173
      - RANDOMHD2_STATE_FILE=/app/.randomhd2/sync-state.json
    volumes:
      - ./data:/app/.randomhd2
